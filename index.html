<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>專屬傳奇卡牌 - 幻影終端．零</title>
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
    <style>
        :root {
            --card-width: min(88vw, 380px);
            --card-aspect: 63 / 88;
            --primary-color: #0f380f;
            --cyber-green: #00ff41;
            --foil-opacity: 0.8;
            --glare-opacity: 0.5;
            --rotate-x: 0deg;
            --rotate-y: 0deg;
            --pointer-x: 50%;
            --pointer-y: 50%;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #121212;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            background: radial-gradient(circle at center, #1a2a1a 0%, #000 100%);
        }

        .app-container {
            display: flex;
            flex-direction: row;
            gap: 2rem;
            padding: 2rem;
            max-width: 1200px;
            width: 100%;
            align-items: center;
            justify-content: center;
        }

        @media (max-width: 767px) {
            .app-container {
                flex-direction: column;
                padding: 1rem;
            }
        }

        /* 3D Stage */
        .card-stage {
            perspective: 1000px;
            display: flex;
            justify-content: center;
            align-items: center;
            width: var(--card-width);
            aspect-ratio: var(--card-aspect);
            position: relative;
        }

        .card-wrapper {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transform-origin: center center;
            transition: transform 0.1s ease-out;
            transform: rotateX(var(--rotate-x)) rotateY(var(--rotate-y));
            will-change: transform;
            border-radius: 18px;
        }

        .card-wrapper.flipped {
            transform: rotateX(0deg) rotateY(180deg) !important;
            transition: transform 0.6s cubic-bezier(0.4, 0.0, 0.2, 1);
        }

        .card-wrapper.resetting {
            transition: transform 0.5s cubic-bezier(0.4, 0.0, 0.2, 1);
        }

        .card-face {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
            border-radius: 18px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5), 0 0 0 1px rgba(255,255,255,0.2);
            background: #000;
            transform: translateZ(0);
        }

        .card-back {
            transform: rotateY(180deg);
            background: url('card_back.jpg') center/cover no-repeat;
            border: 8px solid #000;
        }

        .card-front {
            display: flex;
            flex-direction: column;
            background: linear-gradient(180deg, #111 0%, #051505 100%);
            border: 8px solid #c0c0c0;
            z-index: 1;
        }

        /* Artwork layer */
        .artwork-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 60%;
            background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100"><rect width="100" height="100" fill="%230a1a0a"/><text x="50" y="50" font-family="sans-serif" font-size="5" fill="%2300ff41" text-anchor="middle" alignment-baseline="middle">Matrix Rain Artwork</text></svg>') center/cover;
            z-index: 0;
            border-bottom: 2px solid var(--cyber-green);
        }

        .artwork-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: top center;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        /* Card Layout Elements */
        .card-content {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            height: 100%;
            pointer-events: auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 12px;
            background: rgba(0,0,0,0.7);
            border-bottom: 1px solid var(--cyber-green);
            backdrop-filter: blur(4px);
        }

        .card-name {
            font-size: clamp(1rem, 4vw, 1.2rem);
            font-weight: 900;
            color: #fff;
            text-shadow: 0 0 5px var(--cyber-green);
        }

        .hp-box {
            font-size: clamp(0.9rem, 3.5vw, 1.1rem);
            font-weight: 800;
            color: var(--cyber-green);
        }

        .hp-box small {
            font-size: 0.7rem;
            color: #ccc;
        }

        .card-type-bar {
            background: linear-gradient(90deg, #000 0%, var(--cyber-green) 50%, #000 100%);
            height: 4px;
            width: 100%;
            position: absolute;
            top: 60%;
            z-index: 2;
            box-shadow: 0 0 10px var(--cyber-green);
        }

        .info-panel {
            margin-top: auto;
            background: rgba(10, 20, 10, 0.85);
            height: 40%;
            padding: 8px 10px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            backdrop-filter: blur(5px);
            border-top: 1px solid rgba(0,255,65,0.3);
        }

        .ability {
            background: rgba(0, 255, 65, 0.1);
            border: 1px solid rgba(0, 255, 65, 0.3);
            border-radius: 4px;
            padding: 6px;
        }

        .ability-title {
            color: var(--cyber-green);
            font-weight: bold;
            font-size: clamp(0.75rem, 3vw, 0.85rem);
            margin-bottom: 3px;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .ability-desc {
            font-size: clamp(0.65rem, 2.5vw, 0.75rem);
            line-height: 1.3;
            color: #ddd;
        }

        .move {
            display: flex;
            flex-direction: column;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 6px;
        }

        .move-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .move-cost {
            font-size: clamp(0.7rem, 2.5vw, 0.8rem);
            letter-spacing: 1px;
            color: #aaa;
        }

        .move-name {
            font-weight: bold;
            font-size: clamp(0.85rem, 3vw, 0.95rem);
        }

        .move-damage {
            font-weight: 900;
            font-size: clamp(0.9rem, 3.5vw, 1rem);
            color: #fff;
            text-shadow: 0 0 3px red;
        }

        .move-desc {
            font-size: clamp(0.65rem, 2.5vw, 0.75rem);
            color: #ccc;
            margin-top: 3px;
            line-height: 1.2;
        }

        .stats-footer {
            display: flex;
            justify-content: space-between;
            font-size: clamp(0.55rem, 2vw, 0.65rem);
            color: #aaa;
            margin-top: auto;
            padding-top: 5px;
            border-top: 1px solid rgba(255,255,255,0.2);
        }

        .copyright-bar {
            display: flex;
            justify-content: space-between;
            font-size: clamp(0.45rem, 1.8vw, 0.55rem);
            padding-top: 2px;
            color: #888;
        }

        /* Foil & Glare Layers */
        .foil-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
            mix-blend-mode: color-dodge;
            opacity: var(--foil-opacity);
            background-size: 200% 200%;
            background-position: var(--pointer-x) var(--pointer-y);
        }

        .glare-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 11;
            background: radial-gradient(
                farthest-corner circle at var(--pointer-x) var(--pointer-y),
                rgba(255, 255, 255, 0.8) 0%,
                rgba(255, 255, 255, 0.1) 40%,
                rgba(0, 0, 0, 0.4) 100%
            );
            mix-blend-mode: overlay;
            opacity: var(--glare-opacity);
        }

        /* Foil Styles */
        .foil-cosmos {
            background-image: linear-gradient(115deg, transparent 20%, rgba(255,0,0,0.6) 30%, rgba(255,255,0,0.6) 40%, rgba(0,255,0,0.6) 50%, rgba(0,255,255,0.6) 60%, rgba(0,0,255,0.6) 70%, rgba(255,0,255,0.6) 80%, transparent 90%), url('data:image/svg+xml;utf8,<svg width="100" height="100" xmlns="http://www.w3.org/2000/svg"><filter id="noise"><feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" stitchTiles="stitch"/></filter><rect width="100" height="100" filter="url(%23noise)" opacity="0.3"/></svg>');
            background-blend-mode: color-dodge;
        }

        .foil-rainbow {
            background-image: repeating-linear-gradient(45deg, 
                rgba(255,0,0,0.4) 0%, rgba(255,154,0,0.4) 10%, rgba(208,222,33,0.4) 20%, 
                rgba(79,220,74,0.4) 30%, rgba(63,218,216,0.4) 40%, rgba(47,201,226,0.4) 50%, 
                rgba(28,127,238,0.4) 60%, rgba(95,21,242,0.4) 70%, rgba(186,12,248,0.4) 80%, 
                rgba(251,7,217,0.4) 90%, rgba(255,0,0,0.4) 100%);
        }

        .foil-gold {
            background-image: radial-gradient(circle at center, rgba(255,215,0,0.8) 0%, rgba(184,134,11,0.6) 40%, rgba(0,0,0,0.8) 100%);
            mix-blend-mode: hard-light;
        }

        .foil-silver {
            background-image: linear-gradient(135deg, rgba(255,255,255,0.9) 0%, rgba(200,200,200,0.6) 20%, rgba(100,100,100,0.4) 50%, rgba(200,200,200,0.6) 80%, rgba(255,255,255,0.9) 100%);
            mix-blend-mode: screen;
        }

        /* Control Panel */
        .control-panel {
            background: rgba(25, 25, 25, 0.6);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            width: 100%;
            max-width: 350px;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        label {
            font-size: 0.85rem;
            color: #aaa;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        select, button, input[type="file"] {
            background: #222;
            color: #fff;
            border: 1px solid #444;
            padding: 0.6rem;
            border-radius: 6px;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.2s;
        }

        button {
            background: var(--cyber-green);
            color: #000;
            font-weight: bold;
            text-transform: uppercase;
        }

        button:hover {
            background: #00cc33;
            transform: translateY(-2px);
        }

        button.secondary {
            background: transparent;
            color: var(--cyber-green);
            border-color: var(--cyber-green);
        }

        button.secondary:hover {
            background: rgba(0,255,65,0.1);
        }

        /* Editable fields style */
        [contenteditable="true"] {
            outline: none;
            transition: background 0.2s;
            border-bottom: 1px dashed transparent;
        }

        [contenteditable="true"]:hover, [contenteditable="true"]:focus {
            background: rgba(255,255,255,0.1);
            border-bottom: 1px dashed var(--cyber-green);
            cursor: text;
        }

        #image-upload {
            display: none;
        }

        .upload-btn {
            display: block;
            text-align: center;
            background: #333;
            color: #fff;
            padding: 0.6rem;
            border-radius: 6px;
            cursor: pointer;
            border: 1px solid #555;
            transition: all 0.2s;
        }

        .upload-btn:hover {
            background: #444;
        }

    </style>
</head>
<body>

    <div class="app-container">
        <!-- 3D Stage -->
        <div class="card-stage" id="cardStage">
            <div class="card-wrapper" id="cardWrapper">
                <!-- Front -->
                <div class="card-face card-front" id="cardFront">
                    <!-- Art & Foil Layers -->
                    <div class="artwork-container">
                        <img id="cardArt" class="artwork-image" src="hacker_art.jpg" alt="Card Art">
                    </div>
                    <div class="foil-layer foil-rainbow" id="foilLayer"></div>
                    <div class="glare-layer"></div>
                    
                    <div class="card-type-bar"></div>

                    <!-- Content -->
                    <div class="card-content">
                        <div class="header">
                            <span class="card-name" contenteditable="true">幻影終端．零</span>
                            <span class="hp-box"><small>HP</small> <span contenteditable="true">404</span></span>
                        </div>
                        
                        <div class="info-panel">
                            <div class="ability">
                                <div class="ability-title">⚙ 【Root 權限】</div>
                                <div class="ability-desc" contenteditable="true">無視對手的所有系統防火牆與護盾，所有攻擊必定造成真實穿透傷害。</div>
                            </div>

                            <div class="move">
                                <div class="move-header">
                                    <div><span class="move-cost" contenteditable="true">⚡x2</span> <span class="move-name" contenteditable="true">封包注入</span></div>
                                    <div class="move-damage" contenteditable="true">50</div>
                                </div>
                                <div class="move-desc" contenteditable="true">竊取對手 1 點能量標記轉移至自身。</div>
                            </div>

                            <div class="move">
                                <div class="move-header">
                                    <div><span class="move-cost" contenteditable="true">⚡x4</span> <span class="move-name" contenteditable="true">零日毀滅</span></div>
                                    <div class="move-damage" contenteditable="true">999</div>
                                </div>
                                <div class="move-desc" contenteditable="true">強制癱瘓對手伺服器，使目標下一回合完全無法行動，並消除所有增益狀態。</div>
                            </div>

                            <div class="stats-footer">
                                <div>弱點: <span contenteditable="true">物理拔線 ×2</span></div>
                                <div>抗性: <span contenteditable="true">病毒感染 -50</span></div>
                                <div>撤退: <span contenteditable="true">⚡x1</span></div>
                            </div>
                            
                            <div class="copyright-bar">
                                <span contenteditable="true">Illus. CyberForge Matrix</span>
                                <span><span contenteditable="true">No. 404/999</span> ★★★ <span contenteditable="true">SAR</span></span>
                                <span contenteditable="true">© 2026 Deep Web Archives. All bypassed.</span>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Back -->
                <div class="card-face card-back"></div>
            </div>
        </div>

        <!-- Control Panel -->
        <div class="control-panel">
            <h2 style="font-size: 1.2rem; border-bottom: 1px solid #444; padding-bottom: 0.5rem;">控制終端</h2>
            
            <div class="control-group">
                <label>立繪上傳 (本機預覽)</label>
                <label class="upload-btn" for="image-upload">選擇圖片</label>
                <input type="file" id="image-upload" accept="image/*">
            </div>

            <div class="control-group">
                <label>鐳射箔膜切換</label>
                <select id="foilSelect">
                    <option value="foil-rainbow">Rainbow Secret 極光全息</option>
                    <option value="foil-cosmos">Cosmos Holo 宇宙彩虹</option>
                    <option value="foil-gold">Gold Ultra 黑金浮雕</option>
                    <option value="foil-silver">Silver Phantom 冷冽銀鏡</option>
                    <option value="none">無箔膜</option>
                </select>
            </div>

            <div class="control-group" style="margin-top: 0.5rem; gap: 0.8rem;">
                <button class="secondary" id="flipBtn">翻轉卡牌 (3D 檢視)</button>
                <button id="exportBtn">匯出卡牌 (PNG)</button>
            </div>
            
            <div style="font-size: 0.7rem; color: #888; text-align: center; margin-top: 0.5rem;">
                提示：點擊卡面文字即可直接編輯內容。<br>行動裝置支援觸控傾斜與陀螺儀感測。
            </div>
        </div>
    </div>

    <script>
        const cardStage = document.getElementById('cardStage');
        const cardWrapper = document.getElementById('cardWrapper');
        const root = document.documentElement;
        let isFlipped = false;

        // 3D Parallax Effect
        const handleMove = (e) => {
            if (isFlipped) return;
            
            let clientX, clientY;
            if (e.type.includes('touch')) {
                clientX = e.touches[0].clientX;
                clientY = e.touches[0].clientY;
            } else {
                clientX = e.clientX;
                clientY = e.clientY;
            }

            const rect = cardStage.getBoundingClientRect();
            const x = clientX - rect.left;
            const y = clientY - rect.top;

            // Normalize mouse position between -1 and 1
            const normalizedX = (x / rect.width - 0.5) * 2;
            const normalizedY = (y / rect.height - 0.5) * 2;

            // Rotation multipliers (adjust for sensitivity)
            const rotateX = normalizedY * -20; 
            const rotateY = normalizedX * 20;

            root.style.setProperty('--rotate-x', `${rotateX}deg`);
            root.style.setProperty('--rotate-y', `${rotateY}deg`);
            
            // Foil and Glare position (percentage)
            const px = (x / rect.width) * 100;
            const py = (y / rect.height) * 100;
            
            root.style.setProperty('--pointer-x', `${px}%`);
            root.style.setProperty('--pointer-y', `${py}%`);
        };

        const resetPosition = () => {
            if (isFlipped) return;
            cardWrapper.classList.add('resetting');
            root.style.setProperty('--rotate-x', '0deg');
            root.style.setProperty('--rotate-y', '0deg');
            root.style.setProperty('--pointer-x', '50%');
            root.style.setProperty('--pointer-y', '50%');
            
            setTimeout(() => {
                cardWrapper.classList.remove('resetting');
            }, 500);
        };

        // Desktop Events
        cardStage.addEventListener('mousemove', handleMove);
        cardStage.addEventListener('mouseleave', resetPosition);

        // Mobile Events
        cardStage.addEventListener('touchstart', handleMove, {passive: true});
        cardStage.addEventListener('touchmove', handleMove, {passive: true});
        cardStage.addEventListener('touchend', resetPosition);

        // Gyroscope fallback for mobile
        if (window.DeviceOrientationEvent) {
            window.addEventListener('deviceorientation', (e) => {
                if(isFlipped) return;
                if(e.beta !== null && e.gamma !== null && window.innerWidth < 1024) {
                    const rotateX = Math.max(-20, Math.min(20, e.beta - 45)); 
                    const rotateY = Math.max(-20, Math.min(20, e.gamma));
                    
                    root.style.setProperty('--rotate-x', `${-rotateX}deg`);
                    root.style.setProperty('--rotate-y', `${rotateY}deg`);
                    
                    const px = 50 + (rotateY * 2.5);
                    const py = 50 + (rotateX * 2.5);
                    root.style.setProperty('--pointer-x', `${Math.max(0, Math.min(100, px))}%`);
                    root.style.setProperty('--pointer-y', `${Math.max(0, Math.min(100, py))}%`);
                }
            });
        }

        // Foil Switcher
        const foilSelect = document.getElementById('foilSelect');
        const foilLayer = document.getElementById('foilLayer');
        foilSelect.addEventListener('change', (e) => {
            foilLayer.className = 'foil-layer';
            if (e.target.value !== 'none') {
                foilLayer.classList.add(e.target.value);
                foilLayer.style.display = 'block';
            } else {
                foilLayer.style.display = 'none';
            }
        });

        // Flip Card
        const flipBtn = document.getElementById('flipBtn');
        flipBtn.addEventListener('click', () => {
            isFlipped = !isFlipped;
            if (isFlipped) {
                cardWrapper.classList.add('flipped');
                root.style.setProperty('--rotate-x', '0deg');
            } else {
                cardWrapper.classList.remove('flipped');
                resetPosition();
            }
        });

        // Image Upload (FileReader API)
        const imageUpload = document.getElementById('image-upload');
        const cardArt = document.getElementById('cardArt');
        imageUpload.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (event) => {
                    cardArt.src = event.target.result;
                };
                reader.readAsDataURL(file);
            }
        });

        // Export PNG using html2canvas
        const exportBtn = document.getElementById('exportBtn');
        const cardFront = document.getElementById('cardFront');
        
        exportBtn.addEventListener('click', async () => {
            exportBtn.textContent = '生成中...';
            exportBtn.disabled = true;
            
            const originalTransform = cardWrapper.style.transform;
            cardWrapper.style.transform = 'none';
            cardFront.style.transform = 'none';
            root.style.setProperty('--rotate-x', '0deg');
            root.style.setProperty('--rotate-y', '0deg');
            root.style.setProperty('--pointer-x', '50%');
            root.style.setProperty('--pointer-y', '50%');

            try {
                const canvas = await html2canvas(cardFront, {
                    scale: 3, 
                    backgroundColor: null,
                    useCORS: true,
                    allowTaint: true,
                    logging: false
                });

                const link = document.createElement('a');
                link.download = 'hacker-card-zero.png';
                link.href = canvas.toDataURL('image/png');
                link.click();
            } catch (err) {
                console.error('匯出失敗', err);
                alert('匯出失敗，請確保沒有跨網域圖片限制。');
            } finally {
                cardWrapper.style.transform = originalTransform;
                exportBtn.textContent = '匯出卡牌 (PNG)';
                exportBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
